<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="assets/img/favicon.png" type="image/x-icon">
  <!-- Link to the external CSS file -->
  <link rel="stylesheet" href="assets/css/style.css">

  <title>Registro de usuario</title>
</head>

<body>
  <!-- Preloader -->
  <div class="preloader" id="preloader">
    <div class="spinner">Cargando...</div>
  </div>
  <!-- Header -->
  <header>
    <h1>Registro de usuario</h1>
    <button class="toggle-button" id="toggle-button">☰</button>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="register.html">Registro</a></li>
        <li><a href="forgot-password.html">Recuperar contraseña</a></li>
      </ul>
    </nav>
  </header>
  <div class="login-container">
    <form id="register-form" action="/register" method="post">
                <div class="validation-message" id="validation-message" role="status" aria-live="polite"></div>

                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                        minlength="4"
                        maxlength="20"
                        pattern="[a-zA-Z0-9_]{4,20}"
                        title="Usa entre 4 y 20 caracteres: letras, números o guion bajo."
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="new-password"
                        minlength="8"
                        pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,}"
                        title="Usa mínimo 8 caracteres, una mayúscula, una minúscula y un número."
                        aria-describedby="password-help"
                        required
                    >
                    <small id="password-help">
                        Mínimo 8 caracteres, una mayúscula, una minúscula y un número.
                    </small>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirmar contraseña</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm_password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <button type="submit">Registrarme</button>
            </form>
  </div>
  <footer>
    <p>&copy; 2024 Your Company. All rights reserved.</p>
  </footer>

  <!-- Include the main.js script   -->
  <script src="assets/js/main.js"></script>
</body>

</html>

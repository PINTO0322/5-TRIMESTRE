<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="assets/img/favicon.png" type="image/x-icon">
  <!-- Link to the external CSS file -->
  <link rel="stylesheet" href="assets/css/style.css">

  <title>Recuperar contraseña</title>
</head>

<body>
  <!-- Preloader -->
  <div class="preloader" id="preloader">
    <div class="spinner">Cargando...</div>
  </div>
  <!-- Header -->
  <header>
    <h1>Recuperar contraseña</h1>
    <button class="toggle-button" id="toggle-button">☰</button>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="register.html">Registro</a></li>
        <li><a href="forgot-password.html">Recuperar contraseña</a></li>
      </ul>
    </nav>
  </header>
  <div class="login-container">
    <form id="forgot-password-form"
                  action="/forgot-password"
                  method="post">
                <div class="validation-message" id="validation-message"
                     role="status"
                     aria-live="polite"></div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >
                </div>

                <button type="submit">Solicitar recuperación</button>
            </form>
  </div>
  <footer>
    <p>&copy; 2024 Your Company. All rights reserved.</p>
  </footer>

  <!-- Include the main.js script   -->
  <script src="assets/js/main.js"></script>
</body>

</html>
